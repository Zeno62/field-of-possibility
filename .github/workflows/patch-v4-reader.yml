name: Patch v4 Chinese reader

on:
  push:
    branches:
      - v4.0-revision-sync
    paths:
      - .github/workflows/patch-v4-reader.yml
      - .github/scripts/patch-v4-reader.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.0-revision-sync
          fetch-depth: 0

      - name: Synchronize confirmed v4 revisions to Chinese reader
        run: python3 .github/scripts/patch-v4-reader.py

      - name: Commit synchronized reader and remove one-off files
        shell: bash
        run: |
          rm -f .github/workflows/patch-v4-reader.yml .github/scripts/patch-v4-reader.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/zh-Hans/official-v4.md .github/workflows/patch-v4-reader.yml .github/scripts/patch-v4-reader.py
          git commit -m "docs: sync Chinese reader with consciousness return revision"
          git push origin HEAD:v4.0-revision-sync
