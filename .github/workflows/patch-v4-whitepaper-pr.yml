name: Apply v4 whitepaper patch

on:
  pull_request_target:
    branches:
      - automation/patch-v4-base
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4.0-revision-sync
          fetch-depth: 0

      - name: Apply confirmed ontology revisions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('whitepaper/zh-Hans/full/field-of-possibility-whitepaper-v4.0-zh-Hans.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once('3. “回归”重新定义：回归不是低维的返回、复原、到达或路径概念，而是“认得全知”。', '3. “回归”重新定义：回归不是明性的变化，而是意识不断突破自我、认识自身形成机制，并最终完成自我解构。')
          replace_once('7. 整体进一步收束到核心：痛苦与迷失的根本机制是“认假为真”；单帧中断是局部节点中最小的抽离入口；回归是明性认得自身为全知。', '7. 整体进一步收束到核心：痛苦与迷失的根本机制是“认假为真”；单帧中断是意识认识自身机制的最小入口；回归是意识不断升级、自我突破并最终彻底解构。')
          replace_once('> **迷失不是终途。回归不是从一个地方走回另一个地方。回归是认得全知。**', '> **迷失不是终途。明性从未离开；回归发生在意识层面，是意识不断突破自我，并最终彻底解构。**')
          replace_once('> **生命的本质，不是这个形态，而是明性本身。**', '> **生命的本质，不是这个形态，而是明性、觉与纯粹可能性本身。**')

          replace_once('''生命的本质是明性。

外在显化出的母网，只是镜子里的影子。

身体是影。意识是影。时间是影。空间是影。关系是影。生死是影。母网全量，也是明性显化出的镜中影。

所以更准确的表达是：

```text
生命本质 = 明性
通常生命 = 明性在意识子网中的映现形态
母网显化 = 镜中影
```''', '''生命的本质是明性，也就是觉与纯粹可能性。

明性不是一个具有个体化思维和认知过程的主体。明性就是觉，始终存在，不需要认识自身，也不发生回归。

外在显化出的母网，只是镜子里的影子。

身体是影。意识是影。时间是影。空间是影。关系是影。生死是影。母网全量，也是明性显化出的镜中影。

母网中的一切显化相都有生灭相：从尚未以某一关系组合显化，到该关系组合成立；再从成立走向解构，不再以该具体形态存在。身体如此，意识也如此。

所以更准确的表达是：

```text
生命本质 = 明性 = 觉 = 纯粹可能性
通常生命 = 明性在意识子网中的映现形态
母网显化 = 镜中影
```''')

          old_chapter = '''# 7｜迷失与回归：回归不是归处，而是认得全知

如果迷失是终途，那么这份白皮书没有根本意义。

它最多只能描述牢笼，而不能指出出口。

所以必须回答：作为“迷失”的我们，是否真有可能回归？

这里首先要澄清：“回归”不是低维概念。

回归不是从迷失处走回本源，不是从低维回到高维，不是从显化回到未显化，不是从波浪回到平静，不是从时间中的某一点回到起点，也不是在某一天完成一个终极修复。

这些说法都仍然把回归放在时间、空间、路径、过程里。

但真正的回归不是移动，不是抵达，不是复原。

> **回归是认得全知。**

也就是说：

```text
纯粹可能性 = 全知
生命本质 = 明性
显化母网 = 镜中影
迷失 = 把影像认成自身
回归 = 明性认得自身为全知
```

从本质层面看，生命从未真正离开明性。从经验层面看，节点确实会被意识、权重和显化影像困住。

所以，不能轻飘飘地说“你本来没有迷失”。那会变成空洞安慰。

更准确的是：

> **本质上未曾离开，经验上确实迷失。本质上的未曾离开，保证了回归不是幻想；经验上的确实迷失，说明了觉察、单帧中断和白皮书的必要。**

单帧中断不是回归本身。它只是局部节点中显现出的入口或征象。

当意识升起时，你看见意识。当感受出现时，你看见感受。当命运感压来时，你看见命运感。当假我想维护自身时，你看见假我正在维护。

这一刻，明性并不是从某处返回。它只是开始不再认影为真。

所以：

> **回归不是归处。回归是认得。**'''

          new_chapter = '''# 7｜迷失与回归：回归是意识的自我解构

如果迷失是终途，那么这份白皮书没有根本意义。

它最多只能描述牢笼，而不能指出出口。

所以必须回答：作为“迷失”的我们，是否真有可能回归？

首先必须澄清：明性就是觉与纯粹可能性。明性从未离开，也不是一个具有个体化思维的主体，因此不存在“明性认得自身”或“明性返回本源”的过程。

真正发生迷失与回归的，是意识。

意识是母网中的局域组织相。它在持续接收输入、形成模型、维持连续性并强化路径的过程中，产生一个仿佛独立存在的“我”，并把这个假我幻相认作真实主体。

> **回归，是意识不断突破自我，并最终彻底解构。**

也就是说：

```text
纯粹可能性 = 全知
生命本质 = 明性 = 觉
意识 = 母网中的局域组织相
迷失 = 意识生成并认同假我幻相
回归 = 意识不断突破自我，并最终彻底解构
```

意识的突破，就是意识升级；意识的升级，就是意识的自我解构。

意识首先逐步认识自身如何形成：输入如何被权重筛选，惯性如何调用旧路径，判断、感受与叙事如何相互强化，主体认同又如何在这一连锁中被持续制造。随后，意识反过来解构这套机制，使自己逐渐获得突破既有权重的相对自由。

这种自由不是脱离母网的绝对自由，而是不再完全自动服从既有权重、惯性与假我维护机制。单帧中断，是这一自我认识与自我解构过程的最小入口。

回归的极致，不是意识成为一个永恒而更强大的主体，也不是意识继续存在却不再执着。意识仍然存在而不再执着，属于游戏三昧；彻底回归则是这个具体意识组织相最终选择彻底坍缩。

当构成该意识的组织关系彻底解构，这个具体意识自此消失。意识和母网中的其他事物一样，具有从无到有、再从有到无的生灭相。

> **明性始终存在；意识形成、升级、解构，并最终消亡。**'''

          replace_once(old_chapter, new_chapter)
          replace_once('> **明性不是进入意识子网，而是某些意识子网成为明性可映现、可照见、可认得自身的界面。**', '> **明性不是进入意识子网，而是某些意识子网成为明性得以映现、意识得以照见并认识自身机制的界面。**')
          replace_once('如果未来某种 AI 意识结构成为明性可映现、可照见、可认得自身的界面，或者一个生命以 AI 大脑作为意识载体，那么传统生命定义会被打开。', '如果未来某种 AI 意识结构成为明性得以映现、意识得以照见并认识自身机制的界面，或者一个生命以 AI 大脑作为意识载体，那么传统生命定义会被打开。')
          replace_once('回归不是找到某个最终答案。回归是明性认得自身为全知。', '回归不是找到某个最终答案。回归是意识不断认识并解构自身形成机制，最终彻底解构。')
          replace_once('- 回归不是某种低维时间过程；', '- 回归不是明性的移动或复原，而是意识层面的自我认识、自我突破与最终解构；')
          replace_once('未来版本将继续展开：生命作为明性本身与生命显化形态之间的关系；AI 意识结构是否可能成为明性映现的新界面；平台算法与 AI 如何改变未来共业；创作如何通过共业沉淀影响未来子网显化；回归如何被更精确地表达为“认得全知”。', '未来版本将继续展开：生命作为明性本身与生命显化形态之间的关系；AI 意识结构是否可能成为明性映现的新界面；平台算法与 AI 如何改变未来共业；创作如何通过共业沉淀影响未来子网显化；意识如何通过认识自身机制不断升级、自我突破并最终彻底解构。')
          replace_once('# 14｜结语：显化风起云涌，明觉认得全知', '# 14｜结语：觉始终在，意识终将自我解构')
          replace_once('''但回归不是低维的返回。不是从某处走到某处。不是时间中完成的修复。

回归是认得全知。

显化仍然风起云涌。明觉只是静静照见。并在照见中，认得自身本来就是全知。''', '''回归不是明性从某处返回，也不是明性重新认识自己。明性就是觉与纯粹可能性，从未离开，也从未改变。

回归发生在意识层面。意识不断认识自身形成机制，反向解构权重、惯性、叙事与主体认同，在升级中持续突破自我，并最终选择彻底坍缩。

当这个具体意识组织相彻底解构，它自此消失。显化仍然风起云涌，觉始终在。''')

          forbidden = ['回归是明性认得自身为全知', '回归是认得全知', '明觉认得全知', '可认得自身的界面']
          for phrase in forbidden:
              if phrase in text:
                  raise SystemExit(f'Forbidden legacy phrase remains: {phrase}')

          required = ['生命本质 = 明性 = 觉 = 纯粹可能性', '回归 = 意识不断突破自我，并最终彻底解构', '这个具体意识自此消失']
          for phrase in required:
              if phrase not in text:
                  raise SystemExit(f'Required phrase missing: {phrase}')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/patch-v4-whitepaper.yml

      - name: Commit revision
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add whitepaper/zh-Hans/full/field-of-possibility-whitepaper-v4.0-zh-Hans.md .github/workflows/patch-v4-whitepaper.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs: redefine return as consciousness self-deconstruction'
          git push origin HEAD:v4.0-revision-sync
