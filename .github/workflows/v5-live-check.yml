name: Verify live v5.0 publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-live-check.yml'
      - 'tests/v5_live_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Check live pages, every download, release attachments and mobile layout
        run: python tests/v5_live_check.py
      - name: Save acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-live-acceptance-${{ github.run_id }}
          path: qa-v5-live/
          retention-days: 30
          if-no-files-found: error
